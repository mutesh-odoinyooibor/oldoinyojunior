(function(){
/* SUPABASE: your project values (the publishable key is meant to be public) */
var SUPABASE_URL="https://aetgrpmydsnczewaqado.supabase.co";
var SUPABASE_KEY="sb_publishable_6wIUwfVDSX9fFr3IIp6SuA_BHzE1bNn";

function sbH(extra){var h={"apikey":SUPABASE_KEY,"Content-Type":"application/json"};if(/^eyJ/.test(SUPABASE_KEY))h["Authorization"]="Bearer "+SUPABASE_KEY;for(var k in extra||{})h[k]=extra[k];return h}
function sbFail(r){var e=new Error("supabase "+r.status);e.code=r.status===401||r.status===403?"permission-denied":r.status===404?"table-not-found":"network";throw e}
async function sbGet(p){var r=await fetch(SYNC_URL+"?select=data&path=eq."+encodeURIComponent(p),{headers:sbH()});if(!r.ok)sbFail(r);var a=await r.json();return a.length?a[0].data:null}

async function sbDel(p){var r=await fetch(SYNC_URL+"?path=eq."+encodeURIComponent(p),{method:"DELETE",headers:sbH({"Prefer":"return=minimal"})});if(!r.ok)sbFail(r)}

var snap=function(p,d){return{id:p.split("/").pop(),exists:d!=null,data:function(){return cl(d)}}};
function notify(p){(L[p]||[]).forEach(function(f){rGet(p).then(function(d){f(snap(p,d))}).catch(function(){})})}
function doc(p){return{id:p.split("/").pop(),path:p,
 get:async function(){return snap(p,await rGet(p))},
 set:async function(d){await rSet(p,cl(d));notify(p)},
 delete:async function(){await rDel(p);notify(p)},

function collection(name){var fs=[],q={where:function(f,o,v){fs.push([f,o,v]);return q},get:async function(){var all=await rList(name+"/");return{docs:all.filter(function(x){return fs.every(function(c){var v=x.data&&x.data[c[0]];return c[1]==="=="?v===c[2]:c[1]==="<"?v<c[2]:true})}).map(function(x){return snap(x.path,x.data)})}}};return q}

var db={doc:doc,collection:collection},user={isOwner:function(){return false},canEdit:function(){return false},can:function(){return true}};

 if(e.target.id==="bk"){var all=await rList(""),o={};all.forEach(function(x){o[x.path]=x.data});downloads.save({filename:"elimuhub-backup-"+new Date().toISOString().slice(0,10)+".json",data:JSON.stringify(o)});if(window.note)note("Backup downloaded. Keep the file safe.")}

});
})();

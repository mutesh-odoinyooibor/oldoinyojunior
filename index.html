<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ElimuHub</title><meta name="theme-color" content="#0f1a14">
<style>
:root{--bg:#0f1a14;--card:#1a241f;--tx:#e8efe9;--mut:#9fb0a5;--pri:#4fb383;--onp:#0b140f;--bd:#2a3a30;--gold:#e8b84a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0f1a14}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Arial,sans-serif}
h1{margin:0;color:var(--pri);font-size:26px}.mut{color:var(--mut);font-size:14px}
header{padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:8px}
#opt{display:none;padding:10px 16px;border-bottom:3px solid var(--gold)}#opt.on{display:block}
.g{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
button{color:var(--pri);font-weight:700}button.p{background:var(--pri);color:var(--onp);border-color:var(--pri)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{border:0;border-bottom:4px solid transparent;border-radius:0;background:none;color:var(--mut);white-space:nowrap;padding:14px 12px}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{padding:14px;max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card.l{border-left:8px solid var(--gold)}
textarea{width:100%;min-height:100px;box-sizing:border-box}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td input{width:76px;padding:6px}.logo{height:70px;background:#fff;border-radius:4px}
a{color:#9a9cf2;cursor:pointer;text-decoration:underline;display:block;text-align:center;margin:12px 0}
.sheet{background:#fff;color:#000;border:2px solid #7a1f2b;padding:12px;margin-bottom:14px;page-break-inside:avoid}
.sheet table th,.sheet table td{border-color:#999;color:#000}.sh{display:flex;justify-content:space-between;align-items:center;text-align:center}.sh .logo{height:60px}
@media print{header,#opt,nav,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{border:0;background:#fff;color:#000}}
.pg{display:flex;flex-direction:column;width:210mm;height:296mm;background:#fff;overflow:hidden}
.a5{width:210mm;height:148mm;box-sizing:border-box;padding:4mm;font-family:Georgia,serif;color:#2b1114}
.fr{height:100%;box-sizing:border-box;border:2.5px solid #7a1f2b;outline:1px solid #7a1f2b;outline-offset:2px;background:#fff6d6;padding:2.5mm 3.5mm 4.5mm;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.6mm;overflow:hidden}
.hd{background:#7a1f2b;color:#fff6d6;display:flex;align-items:center;justify-content:space-between;gap:4mm;padding:1.3mm 3mm;border-radius:2px}
.hd .logo{height:13mm;max-width:20mm;object-fit:contain}.hd>span{width:13mm}.hd .tx{text-align:center;flex:1}.cp{width:297mm;height:210mm;box-sizing:border-box;padding:8mm;background:#fff;color:#000;font-family:Georgia,serif;overflow:hidden}.cp table{width:100%;border-collapse:collapse;font-size:9.5px}.cp th{background:#7a1f2b;color:#fff6d6;padding:4px}.cp td{border:1px solid #7a1f2b;padding:3px 4px;white-space:nowrap;color:#000}.cp .logo{height:16mm}.cap .pg{zoom:1!important;box-shadow:none!important;margin:0!important}.nm{font-weight:700;font-size:13px;letter-spacing:.3px}.po{font-size:10px}.tt{font-size:9.5px;letter-spacing:1px}
.cols{display:flex;gap:3mm;min-height:0}.cols>div{flex:1;min-height:0}.cols table{height:100%}.pg,.pg *{-webkit-text-size-adjust:none;text-size-adjust:none}
.ig{display:grid;grid-template-columns:1fr 1fr;border:1px solid #7a1f2b}.ig div{border:1px solid #7a1f2b;padding:1mm 1.6mm;font-size:7.5px;text-transform:uppercase;color:#7a1f2b}.ig b{display:block;font-size:10.5px;color:#000;text-transform:none}
.a5 table{width:100%;border-collapse:collapse;font-size:calc(var(--fs,11.5) * 1px)}.a5 th{background:#7a1f2b;color:#fff6d6;padding:1.8mm 2mm;text-align:left}.a5 td{border:1px solid #7a1f2b;padding:calc(var(--fs,11.5) * .14mm) 2mm;color:#000;white-space:normal;background:#fffdf0}
.bt{margin-top:0;display:flex;justify-content:space-between;align-items:flex-end}.qr{width:23mm;height:23mm;background:#fff;border:1px solid #7a1f2b;image-rendering:pixelated}
@media screen{.pg{zoom:.45;box-shadow:0 0 6px #0006;margin-bottom:10px}}@media screen and (min-width:800px){.pg{zoom:.9}}
@media print{@page{size:A4 portrait;margin:0}main{max-width:none!important;margin:0!important;padding:0!important}body{margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}#nt{display:none!important}}

function autoRem(r){const L=SUBJ.map((j,i)=>({j,v:r.v[i]})).filter(x=>x.v!=null);if(!L.length)return"";const a=r.t/r.c,fn=(r.l.name.split(" ")[0]||"").toLowerCase().replace(/^./,c=>c.toUpperCase()),so=[...L].sort((x,y)=>y.v-x.v),best=so.slice(0,2).map(x=>x.j),low=so.filter(x=>x.v<58).slice(-3).reverse().map(x=>x.j),lst=l=>l.length>1?l.slice(0,-1).join(", ")+" and "+l[l.length-1]:l[0];

async function pdfOf(html,fname,land){const dl=await claude.use("downloads");if(!dl)return note("Download not available here.");if(!window.jspdf||!window.html2canvas)return note("PDF tools did not load. Check your internet and reload the portal.");
const box=document.createElement("div");box.className="cap";box.style.cssText="position:fixed;left:-12000px;top:0";box.innerHTML=html;document.body.appendChild(box);
try{fit();const P=[...box.querySelectorAll(".pg,.cp")],doc=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:land?"landscape":"portrait",compress:true});
for(let i=0;i<P.length;i++){note("Preparing PDF page "+(i+1)+" of "+P.length+"\u2026");const c=await html2canvas(P[i],{scale:1.6,backgroundColor:"#ffffff",useCORS:true,logging:false});if(i)doc.addPage();doc.addImage(c.toDataURL("image/jpeg",.88),"JPEG",0,0,land?297:210,land?210:297)}
await dl.save({filename:fname,data:doc.output("arraybuffer")});note("PDF ready")}catch(e){note(e&&e.code==="declined"?"Download cancelled.":"Could not make the PDF: "+((e&&e.message)||e))}finally{box.remove()}}

$("#cn").onclick=()=>{armed=0;tab="l";app()};
$("#cg").onclick=async()=>{if(!armed){armed=1;clr(m);setTimeout(()=>{if(armed){armed=0;if(tab==="clr")clr(m)}},6000);return}armed=0;await clearClass()}}
async function clearClass(){if(!db)return note("Database not connected.");if(!canW())return note(VO);collect();note("Archiving score sheets\u2026");

applyDirty(X);const ks=Object.keys(X.scores||{}).filter(k=>Object.keys(X.scores[k]||{}).length),ts=Date.now();
for(let i=0;i<ks.length;i++){await tm(db.doc("sheets/"+slug()+"_"+ts+"_"+i).set({cls:S.cls,ts,exp:ts+730*864e5,key:ks[i],learners:X.learners,scores:{[ks[i]]:X.scores[ks[i]]},rem:{[ks[i]]:(X.rem||{})[ks[i]]||{}}}),10000)}
const E={learners:X.learners||[],archive:X.archive||[],bin:X.bin||[],scores:{},rem:{},pub:{}};await tm(db.doc("cls/"+slug()).set(E),10000);dirty={};D=E;ld=true;tab="l";app();note(ks.length?"Scores cleared. Names and numbers kept. "+ks.length+" score sheet set(s) saved in Previous sheets for 2 years.":"There were no scores to clear.")}catch(e){note("Could not clear: "+((e&&e.code)||(e&&e.message)||"error")+". Nothing was deleted.")}}

const sn=await tm(db.collection("sheets").where("cls","==",S.cls).get(),8000),L=sn.docs.map(d=>({id:d.id,...cl(d.data())})).sort((a,b)=>b.ts-a.ts);

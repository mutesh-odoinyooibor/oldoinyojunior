el.innerHTML=L.length?`<div class="w"><table>${L.map((x,i)=>`<tr><td>${new Date(x.ts).toLocaleDateString("en-GB")}</td><td>${esc((x.key||"").split("|").reverse().join(" \u00b7 "))}</td><td>${x.learners.length}</td><td><button data-p="${i}">PDF</button> <button data-q="${i}">Restore</button></td></tr>`).join("")}</table></div><p class="mut">Kept for 2 years from the date cleared, then deleted automatically.</p>`:'<p class="mut">No saved score sheets yet. They appear here when you clear a class.</p>';

await pdfOf(html,(S.cls+"-"+p[2]+"-T"+p[1]+"-"+p[0]).replace(/\W+/g,"-")+".pdf")}
function archRestore(x){const ids=new Set(D.learners.map(l=>l.n)),k=x.key;x.learners.forEach(l=>{if(!ids.has(l.n))D.learners.push(l)});D.scores[k]=Object.assign({},D.scores[k]||{},x.scores[k]||{});D.rem=D.rem||{};D.rem[k]=Object.assign({},D.rem[k]||{},(x.rem||{})[k]||{});persist("Restored "+x.learners.length+" learners and the "+k.split("|").reverse().join(" \u00b7 ")+" scores")}
